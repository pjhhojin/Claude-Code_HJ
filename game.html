<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>선택의 게임</title>
  <style>
    *, *::before, *::after { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Segoe UI', system-ui, sans-serif;
      background: #0d0d1a;
      color: #e8e8f0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
    }

    /* ── 배경 파티클 ── */
    .bg {
      position: fixed;
      inset: 0;
      z-index: 0;
      pointer-events: none;
    }
    .bg span {
      position: absolute;
      border-radius: 50%;
      opacity: 0.08;
      animation: float linear infinite;
    }

    @keyframes float {
      0%   { transform: translateY(110vh) scale(0); opacity: 0; }
      10%  { opacity: 0.12; }
      90%  { opacity: 0.08; }
      100% { transform: translateY(-10vh) scale(1.2); opacity: 0; }
    }

    /* ── 화면 컨테이너 ── */
    .screen {
      display: none;
      width: min(480px, 95vw);
      padding: 32px 24px;
      position: relative;
      z-index: 1;
      animation: fadeIn 0.35s ease;
    }
    .screen.active { display: block; }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(14px); }
      to   { opacity: 1; transform: translateY(0); }
    }

    /* ── 공통 버튼 ── */
    .btn {
      display: inline-block;
      padding: 14px 40px;
      border: none;
      border-radius: 50px;
      font-size: 1.05rem;
      font-weight: 700;
      cursor: pointer;
      transition: transform 0.2s, box-shadow 0.2s;
      background: linear-gradient(135deg, #6c63ff 0%, #9b59b6 100%);
      color: #fff;
      letter-spacing: 0.03em;
    }
    .btn:hover {
      transform: translateY(-3px);
      box-shadow: 0 8px 28px rgba(108, 99, 255, 0.45);
    }
    .btn:active { transform: translateY(0); }

    /* ══════════════════════════════
       시작 화면
    ══════════════════════════════ */
    #start-screen { text-align: center; }

    .start-logo {
      font-size: 3.2rem;
      font-weight: 900;
      letter-spacing: -1px;
      background: linear-gradient(135deg, #6c63ff, #e040fb);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 8px;
    }

    .start-sub {
      font-size: 0.9rem;
      color: #7070a0;
      margin-bottom: 36px;
      line-height: 1.7;
    }

    .rules {
      background: #161628;
      border: 1px solid #2a2a4a;
      border-radius: 16px;
      padding: 20px 24px;
      margin-bottom: 36px;
      text-align: left;
    }
    .rules h3 {
      font-size: 0.8rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #6c63ff;
      margin-bottom: 12px;
    }
    .rules li {
      list-style: none;
      font-size: 0.88rem;
      color: #a0a0c0;
      line-height: 2;
      padding-left: 16px;
      position: relative;
    }
    .rules li::before {
      content: '▸';
      position: absolute;
      left: 0;
      color: #6c63ff;
    }

    /* ══════════════════════════════
       게임 화면
    ══════════════════════════════ */
    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 22px;
    }

    .turn-badge {
      background: #161628;
      border: 1px solid #2a2a4a;
      border-radius: 20px;
      padding: 6px 16px;
      font-size: 0.85rem;
      color: #9090c0;
    }
    .turn-badge strong { color: #e8e8f0; }

    .score-badge {
      font-size: 1.5rem;
      font-weight: 800;
      color: #6c63ff;
    }

    /* 게이지 */
    .gauge-wrap { margin-bottom: 28px; }

    .gauge-meta {
      display: flex;
      justify-content: space-between;
      font-size: 0.75rem;
      color: #6060a0;
      margin-bottom: 7px;
    }

    .gauge-track {
      width: 100%;
      height: 18px;
      background: #161628;
      border-radius: 9px;
      border: 1px solid #2a2a4a;
      overflow: hidden;
      position: relative;
    }

    .gauge-fill {
      height: 100%;
      width: 0%;
      border-radius: 9px;
      background: linear-gradient(90deg, #6c63ff, #e040fb);
      transition: width 0.55s cubic-bezier(0.25, 0.8, 0.25, 1);
      position: relative;
    }
    .gauge-fill::after {
      content: '';
      position: absolute;
      inset: 2px 4px;
      border-radius: 6px;
      background: rgba(255,255,255,0.15);
    }

    /* 점수 팝업 */
    .score-popup {
      position: fixed;
      font-size: 2rem;
      font-weight: 900;
      pointer-events: none;
      z-index: 999;
      animation: popUp 0.9s ease forwards;
    }
    @keyframes popUp {
      0%   { opacity: 1; transform: translateY(0) scale(0.7); }
      30%  { transform: translateY(-18px) scale(1.1); opacity: 1; }
      100% { transform: translateY(-60px) scale(0.9); opacity: 0; }
    }

    /* 선택지 카드 */
    .choices { display: flex; gap: 12px; margin-bottom: 20px; }

    .card {
      flex: 1;
      min-height: 120px;
      border-radius: 16px;
      border: 2px solid #2a2a4a;
      background: #131328;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 6px;
      transition: transform 0.22s, border-color 0.22s, box-shadow 0.22s;
      user-select: none;
      perspective: 600px;
    }
    .card:hover:not(.locked) {
      transform: translateY(-6px);
      border-color: #6c63ff;
      box-shadow: 0 12px 30px rgba(108, 99, 255, 0.3);
    }
    .card.locked { cursor: default; }

    .card-label {
      font-size: 0.72rem;
      text-transform: uppercase;
      letter-spacing: 0.1em;
      color: #5050a0;
    }
    .card-icon {
      font-size: 2rem;
      line-height: 1;
      transition: transform 0.3s;
    }
    .card-value {
      font-size: 1.7rem;
      font-weight: 900;
      opacity: 0;
      transform: scale(0.5);
      transition: opacity 0.25s 0.1s, transform 0.25s 0.1s;
    }

    .card.revealed .card-icon { transform: scale(0); opacity: 0; transition: transform 0.2s, opacity 0.2s; }
    .card.revealed .card-value { opacity: 1; transform: scale(1); }

    .card.chosen  { border-color: #6c63ff; background: #1a1a38; }
    .card.pos     { border-color: #22c55e; }
    .card.pos .card-value { color: #22c55e; }
    .card.neg     { border-color: #ef4444; }
    .card.neg .card-value { color: #ef4444; }

    /* 결과 텍스트 */
    .result {
      min-height: 38px;
      text-align: center;
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: 0.02em;
      margin-bottom: 18px;
      transition: opacity 0.2s;
    }
    .result.pos { color: #22c55e; }
    .result.neg { color: #ef4444; }

    .next-btn-wrap { text-align: center; min-height: 54px; }

    /* ══════════════════════════════
       종료 화면
    ══════════════════════════════ */
    #end-screen { text-align: center; }

    .end-title {
      font-size: 2rem;
      font-weight: 900;
      margin-bottom: 6px;
    }

    .end-score-ring {
      width: 140px;
      height: 140px;
      border-radius: 50%;
      border: 4px solid #6c63ff;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      margin: 24px auto;
      background: #161628;
      box-shadow: 0 0 40px rgba(108, 99, 255, 0.3);
    }
    .end-score-num {
      font-size: 3rem;
      font-weight: 900;
      color: #6c63ff;
      line-height: 1;
    }
    .end-score-label { font-size: 0.75rem; color: #6060a0; margin-top: 2px; }

    .end-msg {
      color: #9090c0;
      font-size: 0.95rem;
      margin-bottom: 36px;
      line-height: 1.6;
    }
  </style>
</head>
<body>

<!-- 배경 파티클 -->
<div class="bg" id="bg"></div>

<!-- ── 시작 화면 ── -->
<div class="screen active" id="start-screen">
  <div class="start-logo">선택의 게임</div>
  <p class="start-sub">매 턴, 세 가지 선택지 중 하나를 고르세요</p>
  <div class="rules">
    <h3>게임 규칙</h3>
    <ul>
      <li>각 선택지의 점수는 숨겨져 있습니다</li>
      <li>선택 후 결과가 공개되며 점수가 변합니다</li>
      <li>점수 획득 : +1 ~ +10 &nbsp;|&nbsp; 점수 손실 : -1 ~ -9</li>
      <li>점수가 100에 도달하거나 10턴이 끝나면 종료</li>
    </ul>
  </div>
  <button class="btn" onclick="startGame()">게임 시작</button>
</div>

<!-- ── 게임 화면 ── -->
<div class="screen" id="game-screen">
  <div class="game-header">
    <div class="turn-badge">턴 <strong id="turn-now">1</strong> / 10</div>
    <div class="score-badge" id="score-now">0</div>
  </div>

  <div class="gauge-wrap">
    <div class="gauge-meta">
      <span>점수</span><span>100</span>
    </div>
    <div class="gauge-track">
      <div class="gauge-fill" id="gauge-fill"></div>
    </div>
  </div>

  <div class="choices" id="choices"></div>

  <div class="result" id="result"></div>

  <div class="next-btn-wrap">
    <button class="btn" id="next-btn" style="display:none" onclick="nextTurn()">다음 턴 →</button>
  </div>
</div>

<!-- ── 종료 화면 ── -->
<div class="screen" id="end-screen">
  <div class="end-title" id="end-title"></div>
  <div class="end-score-ring">
    <div class="end-score-num" id="end-score"></div>
    <div class="end-score-label">점수</div>
  </div>
  <p class="end-msg" id="end-msg"></p>
  <button class="btn" onclick="startGame()">다시하기</button>
</div>

<script>
  /* ── 배경 파티클 생성 ── */
  (function () {
    const bg = document.getElementById('bg');
    const colors = ['#6c63ff', '#9b59b6', '#e040fb', '#22c55e'];
    for (let i = 0; i < 18; i++) {
      const s = document.createElement('span');
      const size = 40 + Math.random() * 120;
      s.style.cssText = `
        width:${size}px; height:${size}px;
        left:${Math.random() * 100}%;
        background:${colors[i % colors.length]};
        animation-duration:${10 + Math.random() * 14}s;
        animation-delay:${-Math.random() * 15}s;
      `;
      bg.appendChild(s);
    }
  })();

  /* ── 게임 상태 ── */
  let score = 0;
  let turn  = 1;
  let locked = false;
  let choiceValues = [];

  /* ── 화면 전환 ── */
  function showScreen(id) {
    document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
    const el = document.getElementById(id);
    el.classList.add('active');
  }

  /* ── 선택지 생성 (+1~10, -1~-9, 항상 최고+ >= 최고- 절댓값 보장) ── */
  function makeChoices() {
    let vals;
    do {
      vals = Array.from({ length: 3 }, () =>
        Math.random() < 0.5
          ? Math.floor(Math.random() * 10) + 1          // +1 ~ +10
          : -(Math.floor(Math.random() * 9) + 1)        // -1 ~ -9
      );
    } while (!validChoices(vals));
    return vals;
  }

  /* 제약: 양수 최솟값 > 음수 절댓값 최댓값 (둘 다 존재할 때만) */
  function validChoices(vals) {
    const pos = vals.filter(v => v > 0);
    const neg = vals.filter(v => v < 0).map(v => -v);
    if (!pos.length || !neg.length) return true;
    return Math.min(...pos) > Math.max(...neg);
  }

  /* ── 선택지 렌더 ── */
  function renderChoices() {
    const wrap = document.getElementById('choices');
    wrap.innerHTML = '';
    ['A', 'B', 'C'].forEach((lbl, i) => {
      const card = document.createElement('div');
      card.className = 'card';
      card.id = `card-${i}`;
      card.innerHTML = `
        <span class="card-label">${lbl}</span>
        <span class="card-icon">❓</span>
        <span class="card-value"></span>
      `;
      card.addEventListener('click', () => pick(i));
      wrap.appendChild(card);
    });
  }

  /* ── 선택 처리 ── */
  function pick(idx) {
    if (locked) return;
    locked = true;

    const labels = ['A', 'B', 'C'];

    /* 모든 카드 공개 */
    choiceValues.forEach((v, i) => {
      const card = document.getElementById(`card-${i}`);
      card.classList.add('locked', 'revealed', v > 0 ? 'pos' : 'neg');
      if (i === idx) card.classList.add('chosen');
      card.querySelector('.card-value').textContent = (v > 0 ? '+' : '') + v;
    });

    const gained = choiceValues[idx];
    const prevScore = score;
    score = Math.min(100, Math.max(0, score + gained));

    /* 결과 텍스트 */
    const res = document.getElementById('result');
    res.textContent = gained > 0 ? `+${gained} 점 획득!` : `${gained} 점 감소!`;
    res.className = 'result ' + (gained > 0 ? 'pos' : 'neg');

    /* 점수 팝업 */
    spawnPopup(gained, document.getElementById(`card-${idx}`));

    /* 게이지·점수 갱신 */
    updateHUD();

    /* 종료 판정 */
    if (score >= 100) {
      setTimeout(() => endGame(true), 1100);
    } else if (turn >= 10) {
      setTimeout(() => endGame(false), 1100);
    } else {
      document.getElementById('next-btn').style.display = 'inline-block';
    }
  }

  /* ── HUD 갱신 ── */
  function updateHUD() {
    document.getElementById('turn-now').textContent  = turn;
    document.getElementById('score-now').textContent = score;
    document.getElementById('gauge-fill').style.width = score + '%';
  }

  /* ── 점수 팝업 ── */
  function spawnPopup(val, anchor) {
    const rect = anchor.getBoundingClientRect();
    const el = document.createElement('div');
    el.className = 'score-popup';
    el.textContent = (val > 0 ? '+' : '') + val;
    el.style.color = val > 0 ? '#22c55e' : '#ef4444';
    el.style.left  = (rect.left + rect.width / 2 - 24) + 'px';
    el.style.top   = (rect.top - 10) + 'px';
    document.body.appendChild(el);
    el.addEventListener('animationend', () => el.remove());
  }

  /* ── 다음 턴 ── */
  function nextTurn() {
    turn++;
    locked = false;
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('result').textContent = '';
    document.getElementById('result').className = 'result';
    updateHUD();
    choiceValues = makeChoices();
    renderChoices();
  }

  /* ── 게임 종료 ── */
  function endGame(clear) {
    document.getElementById('end-score').textContent = score;
    if (clear) {
      document.getElementById('end-title').textContent = '🎉 클리어!';
      document.getElementById('end-msg').textContent   = `${turn}턴 만에 100점을 달성했습니다!\n대단해요!`;
    } else {
      document.getElementById('end-title').textContent = '게임 종료';
      document.getElementById('end-msg').textContent   = `10턴이 모두 끝났습니다.\n최종 점수: ${score}점`;
    }
    showScreen('end-screen');
  }

  /* ── 게임 시작 / 재시작 ── */
  function startGame() {
    score  = 0;
    turn   = 1;
    locked = false;
    document.getElementById('next-btn').style.display = 'none';
    document.getElementById('result').textContent = '';
    document.getElementById('result').className   = 'result';
    updateHUD();
    document.getElementById('gauge-fill').style.width = '0%';
    choiceValues = makeChoices();
    renderChoices();
    showScreen('game-screen');
  }
</script>
</body>
</html>
